<!DOCTYPE html>
<meta charset="utf-8" />
<title>Pixel Algebra (live → WGSL → GPU)</title>
<style>
  body {
    font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
    background: #111;
    color: #eee;
    display: flex;
    height: 100vh;
    margin: 0;
  }
  #editor_pane,
  #render_pane {
    flex: 1;
    padding: 1rem;
    display: flex;
    flex-direction: column;
  }
  #editor_pane {
    border-right: 1px solid #333;
  }
  #editor, #text_editor {
    width: 100%;
    background: #222;
    border: 1px solid #444;
    color: #eee;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    flex-grow: 1;
  }
  #editor {
      height: 60%;
  }
  #text_editor {
      margin-top: 1rem;
      height: 20%;
  }
  canvas {
    width: 100%;
    height: 100%;
    background: #000;
  }
  button {
    background: #444;
    color: #eee;
    border: 1px solid #666;
    padding: 0.5rem 1rem;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  #buttons {
      display: flex;
      gap: 0.5rem;
  }
  #notes {
    margin-top: 1rem;
    background: #222;
    padding: 0.5rem;
    font-size: 12px;
    height: 100px;
    overflow-y: scroll;
    white-space: pre-wrap;
  }
</style>
<body>
  <div id="editor_pane">
    <textarea id="editor">
r = 0.5 + 0.5 * cos(t + x * 0.01)
g = 0.5 + 0.5 * cos(t + y * 0.01 + 2.0)
b = 0.5 + 0.5 * cos(t + x * 0.01 + y * 0.01 + 4.0)
a = 1.0

// Animate the text color
let text_r = 0.5 + 0.5 * sin(t * 2.0);
let text_g = 0.5 + 0.5 * sin(t * 3.0);
let text_b = 0.5 + 0.5 * sin(t * 5.0);
textColor(text_r, text_g, text_b, 1.0);
</textarea
    >
    <div id="buttons">
      <button id="run_button">Run</button>
      <button id="vm_mode_button">Run in VM</button>
      <button id="debug_vm_button">Debug VM</button>
      <button id="clear_button">Clear state</button>
      <select id="example_select">
        <option value="wave">Example: wave</option>
        <option value="feedback">Example: feedback</option>
        <option value="plasma">Example: plasma</option>
        <option value="text_fx">Example: text fx</option>
      </select>
    </div>
    <div id="notes">init…</div>
    <textarea id="text_editor">Type in the text area to see your keystrokes rendered by the GPU.</textarea>
  </div>
  <div id="render_pane">
    <canvas></canvas>
  </div>

  <script type="module">
    // --- Core Setup ---
    const canvas = document.querySelector('canvas');
    const editor = document.getElementById('editor');
    const textEditor = document.getElementById('text_editor');
    const notes = document.getElementById('notes');
    let t0 = performance.now();
    let frame = 0;

    function log(msg) {
      notes.textContent = msg;
      console.log(msg);
    }

    if (!navigator.gpu) {
      throw new Error('WebGPU not supported on this browser.');
    }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      throw new Error('No appropriate GPUAdapter found.');
    }
    const device = await adapter.requestDevice();
    const context = canvas.getContext('webgpu');
    const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
    context.configure({
      device: device,
      format: canvasFormat,
    });

    // --- Uniforms ---
    const uniformBuffer = device.createBuffer({
      size: 20, // 5 floats: width, height, time, frame, glyphCount
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // --- Ping-Pong Textures for Feedback ---
    let tex_a = createTexture();
    let tex_b = createTexture();
    function createTexture() {
        return device.createTexture({
            size: [canvas.clientWidth, canvas.clientHeight],
            format: 'rgba8unorm',
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
        });
    }

    // --- Pixel VM Resources ---
    const OPCODE_MAP = {
      NOP: 0x0, LOAD: 0x1, STORE: 0x2, ADD: 0x3, SUB: 0x4, MUL: 0x5, DIV: 0x6,
      SIN: 0x7, COS: 0x8, MOV: 0x9, JMP: 0xA, JZ: 0xB, CALL: 0xC, RET: 0xD,
      SAMPLE: 0xE, HALT: 0xF,
    };
    const pcmBuffer = device.createBuffer({
        size: 1024 * 2, // 1KB of bytecode
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
    });
    const regBuffer = device.createBuffer({
        size: 16 * 4, // 16 float32 registers
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
    });
    const memBuffer = device.createBuffer({
        size: 256 * 256 * 4 * 4, // 256x256 RGBA pixel memory
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.TEXTURE_BINDING
    });
    const stackBuffer = device.createBuffer({
        size: 1024 * 4, // 1KB stack
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
    });

    // --- Text Rendering ---
    const FONT_ATLAS_SIZE = 1024;
    const GLYPHS_PER_ROW = 16;
    const GLYPH_ASCII_START = 32;
    const NUM_GLYPHS = 95;
    const MAX_GLYPHS_ON_SCREEN = 1024;

    // 1. Procedural Font Atlas (SDF)
    const { sdfTexture, charMetrics } = createSDFTexture();

    // 2. Glyph Instance Buffer
    const glyphBuffer = device.createBuffer({
        size: MAX_GLYPHS_ON_SCREEN * 24, // 6 floats per glyph (codepoint, x, y, size, r, g, b, a)
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });

    // 3. Bind Group for Text
     const textBindGroupLayout = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: {} },
            { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
            { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
            { binding: 3, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
        ],
    });

    const textBindGroup = device.createBindGroup({
        layout: textBindGroupLayout,
        entries: [
            { binding: 0, resource: sdfTexture.createView() },
            { binding: 1, resource: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }) },
            { binding: 2, resource: { buffer: glyphBuffer } },
            { binding: 3, resource: { buffer: uniformBuffer } },
        ],
    });


    // --- Main Pixel Algebra Rendering ---
    let pipeline;
    let bindGroup;
    let userCode = editor.value;

    let vmComputePipeline;
    let vmRenderPipeline;
    let vmComputeBindGroup;
    let vmRenderBindGroup;

    function setupVMPipelines() {
        const vmComputeModule = device.createShaderModule({
            code: `
                struct Registers { values: array<f32, 16>, }
                struct Memory { pixels: array<vec4f, 65536>, } // 256x256 RGBA
                @group(0) @binding(0) var<storage, read> code: array<u16>;
                @group(0) @binding(1) var<storage, read_write> memory: Memory;
                @group(0) @binding(2) var<storage, read_write> regs: Registers;
                @group(0) @binding(3) var<storage, read_write> stack: array<u32>;
                @group(0) @binding(4) var prevFrame: texture_2d<f32>;
                @group(0) @binding(5) var smplr: sampler;

                var<private> sp: u32 = 0;

                @compute @workgroup_size(8, 8)
                fn vm_main(@builtin(global_invocation_id) id: vec3<u32>) {
                    var pc: u32 = 0;
                    var running: bool = true;
                    while (running && pc < arrayLength(&code)) {
                        let instr = code[pc];
                        let opcode = (instr >> 12) & 0xF;
                        let op1 = (instr >> 8) & 0xF;
                        let op2 = instr & 0xFF;
                        switch (opcode) {
                            case 0x0: { pc++; } // NOP
                            case 0x1: { regs.values[op1] = f32(op2); pc++; } // LOAD
                            case 0x2: { // STORE
                                let x = op1;
                                let y = (op2 >> 4) & 0xF;
                                let chan = op2 & 0xF;
                                memory.pixels[id.y * 256 + id.x][chan] = regs.values[op1];
                                pc++;
                            }
                            case 0x3: { regs.values[op1] = regs.values[op1] + regs.values[op2]; pc++; } // ADD
                            case 0x7: { regs.values[op1] = sin(regs.values[op2]); pc++; } // SIN
                            case 0xB: { // JZ
                                if (regs.values[op1] == 0.0) {
                                    pc = u32(op2);
                                } else {
                                    pc++;
                                }
                            }
                            case 0xE: { // SAMPLE
                                let uv = vec2f(regs.values[op1], regs.values[op2]);
                                regs.values[op1] = textureSample(prevFrame, smplr, uv).r;
                                pc++;
                            }
                            case 0xC: { // CALL
                                stack[sp] = pc + 1;
                                sp++;
                                pc = u32(op1);
                            }
                            case 0xD: { // RET
                                sp--;
                                pc = stack[sp];
                            }
                            case 0xF: { running = false; } // HALT
                            default: { pc++; }
                        }
                    }
                }
            `,
        });

        vmComputePipeline = device.createComputePipeline({
            layout: 'auto',
            compute: {
                module: vmComputeModule,
                entryPoint: 'vm_main',
            },
        });

        const vmRenderModule = device.createShaderModule({
            code: `
                @group(0) @binding(0) var<storage, read> memory: { pixels: array<vec4f, 65536>, };

                @fragment
                fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                    let idx = u32(pos.y) * 256 + u32(pos.x);
                    return memory.pixels[idx];
                }
            `
        });

        vmRenderPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: device.createShaderModule({
                    code: `
                        @vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
                            let pos = array(
                                vec2f(-1, -1), vec2f(1, -1), vec2f(-1, 1),
                                vec2f(-1, 1), vec2f(1, -1), vec2f(1, 1)
                            );
                            return vec4f(pos[vi], 0.0, 1.0);
                        }`,
                }),
                entryPoint: 'vs',
            },
            fragment: {
                module: vmRenderModule,
                entryPoint: 'fs',
                targets: [{ format: canvasFormat }],
            },
        });

        vmComputeBindGroup = device.createBindGroup({
            layout: vmComputePipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: pcmBuffer } },
                { binding: 1, resource: { buffer: memBuffer } },
                { binding: 2, resource: { buffer: regBuffer } },
                { binding: 3, resource: { buffer: stackBuffer } },
                { binding: 4, resource: tex_b.createView() },
                { binding: 5, resource: device.createSampler() },
            ],
        });

        vmRenderBindGroup = device.createBindGroup({
            layout: vmRenderPipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: memBuffer } },
            ],
        });
    }

    function setupMainPipeline(fragmentShader) {
      const bindGroupLayout = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
          { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: {} },
          { binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
        ],
      });

      pipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout, textBindGroupLayout] }),
        vertex: {
          module: device.createShaderModule({
            code: `
                        @vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
                            let pos = array(
                                vec2f(-1, -1), vec2f(1, -1), vec2f(-1, 1),
                                vec2f(-1, 1), vec2f(1, -1), vec2f(1, 1)
                            );
                            return vec4f(pos[vi], 0.0, 1.0);
                        }`,
          }),
          entryPoint: 'vs',
        },
        fragment: {
          module: device.createShaderModule({ code: fragmentShader }),
          entryPoint: 'fs',
          targets: [{ format: canvasFormat }],
        },
        primitive: { topology: 'triangle-list' },
      });

      bindGroup = device.createBindGroup({
        layout: bindGroupLayout,
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: tex_b.createView() },
          { binding: 2, resource: device.createSampler() },
        ],
      });
    }

    function compileAndRun() {
        userCode = editor.value;
        const uniformDeclarations = `
            struct Uniforms {
                width: f32,
                height: f32,
                time: f32,
                frame: f32,
                glyphCount: f32,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;
            @group(0) @binding(1) var prevFrame: texture_2d<f32>;
            @group(0) @binding(2) var smplr: sampler;
        `;
        const textDeclarations = `
            struct Glyph {
                codepoint: u32,
                x: f32,
                y: f32,
                size: f32,
                r: f32,
                g: f32,
                b: f32,
                a: f32,
            };
            struct Glyphs {
                glyphs: array<Glyph>,
            };
            @group(1) @binding(0) var sdf_atlas: texture_2d<f32>;
            @group(1) @binding(1) var sdf_sampler: sampler;
            @group(1) @binding(2) var<storage, read> glyph_data: Glyphs;
        `;

        const helperFunctions = `
            fn hsv(h: f32, s: f32, v: f32) -> vec3f {
                let c = v * s;
                let h_ = h * 6.0;
                let x = c * (1.0 - abs(h_ % 2.0 - 1.0));
                var r, g, b: f32;
                if (h_ < 1.0) { r = c; g = x; b = 0.0; }
                else if (h_ < 2.0) { r = x; g = c; b = 0.0; }
                else if (h_ < 3.0) { r = 0.0; g = c; b = x; }
                else if (h_ < 4.0) { r = 0.0; g = x; b = c; }
                else if (h_ < 5.0) { r = x; g = 0.0; b = c; }
                else { r = c; g = 0.0; b = x; }
                let m = v - c;
                return vec3f(r + m, g + m, b + m);
            }
            fn prev(uv: vec2f) -> vec4f {
                return textureSample(prevFrame, smplr, uv);
            }
        `;

        const textRenderFunction = `
            var<private> text_color_val: vec4f = vec4f(1.0, 1.0, 1.0, 1.0);
            fn textColor(r: f32, g: f32, b: f32, a: f32) {
                text_color_val = vec4f(r, g, b, a);
            }

            fn renderText(fragCoord: vec2f, baseColor: vec4f) -> vec4f {
                var color = baseColor;
                for (var i = 0u; i < u32(u.glyphCount); i = i + 1u) {
                     let g = glyph_data.glyphs[i];
                     if (g.codepoint == 0u) { break; }

                     let atlas_uv = get_atlas_uv(g.codepoint, (fragCoord - vec2f(g.x, g.y)) / g.size);
                     if (atlas_uv.x < 0.0) { continue; }

                     let dist = textureSample(sdf_atlas, sdf_sampler, atlas_uv).r;
                     let w = fwidth(dist);
                     let alpha = smoothstep(0.5 - w, 0.5 + w, dist);

                     let glyph_color = text_color_val;
                     color = mix(color, glyph_color, alpha);
                }
                return color;
            }

            fn get_atlas_uv(codepoint: u32, local_uv: vec2f) -> vec2f {
                if (codepoint < 32u || codepoint > 126u) { return vec2f(-1.0); }
                if (local_uv.x < 0.0 || local_uv.x > 1.0 || local_uv.y < 0.0 || local_uv.y > 1.0) { return vec2f(-1.0); }

                let glyph_index = codepoint - 32u;
                let glyph_x = f32(glyph_index % 16u);
                let glyph_y = f32(floor(f32(glyph_index) / 16.0));

                let uv_in_cell = local_uv / 16.0;
                let atlas_uv = vec2f(glyph_x / 16.0, glyph_y / 16.0) + uv_in_cell;

                return atlas_uv;
            }
        `;

        // Transpile user code from simple assignments to WGSL
        let transpiledCode = userCode
            .replace(/let\s+/g, 'var ')
            .replace(/const\s+/g, 'let ')
            .replace(/(\d+\.\d+)/g, "$1f")
            .replace(/(\d+)([^f\w.])/g, "$1.0$2")
            .replace(/vec[234]/g, "$&f");

        if (debugVM) {
            setupDebugPipeline();
            log('VM debug pipeline setup successful.');
        } else if (useVM) {
            setupVMPipelines();
            log('VM pipelines setup successful.');
        } else {
            const shader = `
                ${uniformDeclarations}
                ${textDeclarations}
                ${helperFunctions}
                ${textRenderFunction}

                @fragment
                fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                    let x = pos.x;
                    let y = pos.y;
                    let width = u.width;
                    let height = u.height;
                    let uv = pos.xy / vec2f(width, height);
                    let t = u.time;
                    let mouse = vec2f(0.0, 0.0); // Placeholder
                    var r, g, b, a: f32;

                    ${transpiledCode}

                    var final_color = vec4f(r, g, b, a);
                    final_color = renderText(pos.xy, final_color);
                    return final_color;
                }
            `;
            try {
                setupMainPipeline(shader);
                log('Compilation successful.');
            } catch(e) {
                log(`Shader compilation error:\n${e.message}`);
            }
        }
    }

    // --- Keystroke Handling & Text Buffer Update ---
    function updateGlyphBuffer() {
        const text = textEditor.value;
        const data = new Float32Array(MAX_GLYPHS_ON_SCREEN * 8); // 8 floats per glyph
        let cursorX = 10.0;
        let cursorY = 20.0;
        const fontSize = 16.0;
        const lineHeight = 20.0;
        const advance = 9.0;

        for(let i = 0; i < text.length; i++) {
            const char = text[i];
            if (i >= MAX_GLYPHS_ON_SCREEN) break;

            if (char === '\n') {
                cursorX = 10.0;
                cursorY += lineHeight;
                continue;
            }

            const codepoint = char.charCodeAt(0);
            const offset = i * 8; // 8 floats per glyph
            data[offset + 0] = codepoint;
            data[offset + 1] = cursorX;
            data[offset + 2] = cursorY;
            data[offset + 3] = fontSize;
            data[offset + 4] = 1.0; // r
            data[offset + 5] = 1.0; // g
            data[offset + 6] = 1.0; // b
            data[offset + 7] = 1.0; // a

            cursorX += advance;
        }
        device.queue.writeBuffer(glyphBuffer, 0, data);
    }

    textEditor.addEventListener('input', updateGlyphBuffer);

    // --- Pixel VM Compiler ---
    class PixelAlgebraToPCM {
        constructor() {
            this.bytecode = [];
            this.registerCount = 0;
        }

        compile(algebra) {
            this.bytecode = [];
            this.registerCount = 0;
            const lines = algebra.split('\n').filter(l => l.trim() && !l.startsWith('//'));
            for (const line of lines) {
                if (line.startsWith('if')) {
                    const condition = line.match(/if \((.*)\)/)[1];
                    const r = this.compileTerm(condition);
                    const jump_location = this.bytecode.length + 2; // Jump over the next instruction
                    this.emit('JZ', r, jump_location);
                } else if (line.includes('=')) {
                    const [varName, expr] = line.split('=').map(s => s.trim());
                    if (['r', 'g', 'b', 'a'].includes(varName)) {
                        this.compileExpression(expr, varName);
                    }
                }
            }
            this.emit('HALT');
            return new Uint16Array(this.bytecode);
        }

        compileExpression(expr, target) {
            // Simple regex-based parser for demo (extend with full AST later)
            if (expr.includes('sin')) {
                const inner = expr.match(/sin\((.*?)\)/)[1];
                const [left, right] = inner.split('+').map(s => s.trim());
                const r1 = this.compileTerm(left); // e.g., x * 0.01
                const r2 = this.compileTerm(right); // e.g., t
                const r3 = this.allocRegister();
                this.emit('ADD', r3, r1, r2);
                const r4 = this.allocRegister();
                this.emit('SIN', r4, r3);
                this.emit('STORE', this.channelToIndex(target), r4);
            }
            } else if (expr.includes('prev')) {
                const inner = expr.match(/prev\((.*?)\)/)[1];
                const r1 = this.loadValue(inner);
                const r2 = this.allocRegister();
                this.emit('SAMPLE', r2, r1);
                this.emit('STORE', this.channelToIndex(target), r2);
            }
            // Add cases for cos, mul, div, etc.
        }

        compileTerm(term) {
            if (term.includes('*')) {
                const [left, right] = term.split('*').map(s => s.trim());
                const r1 = this.loadValue(left);
                const r2 = this.loadValue(right);
                const r3 = this.allocRegister();
                this.emit('MUL', r3, r1, r2);
                return r3;
            }
            return this.loadValue(term);
        }

        loadValue(val) {
            const reg = this.allocRegister();
            if (['x', 'y', 't', 'width', 'height'].includes(val)) {
                this.emit('LOAD', reg, this.varToIndex(val));
            } else if (!isNaN(parseFloat(val))) {
                this.emit('LOAD', reg, parseFloat(val));
            }
            return reg;
        }

        emit(op, ...operands) {
            const opcode = OPCODE_MAP[op];
            let instr = (opcode << 12);
            if (operands.length === 3) {
                instr |= (operands[0] << 8) | (operands[1] << 4) | operands[2];
            } else if (operands.length === 2) {
                instr |= (operands[0] << 8) | operands[1];
            } else if (operands.length === 1) {
                instr |= operands[0];
            }
            this.bytecode.push(instr);
        }

        allocRegister() {
            return this.registerCount++;
        }

        varToIndex(varName) {
            const map = { x: 0, y: 1, t: 2, width: 3, height: 4 };
            return map[varName] || 0;
        }

        channelToIndex(channel) {
            const map = { r: 0, g: 1, b: 2, a: 3 };
            return map[channel] || 0;
        }
    }
    const pcmCompiler = new PixelAlgebraToPCM();
    let useVM = false;
    let debugVM = false;
    document.getElementById('vm_mode_button').onclick = () => {
        useVM = !useVM;
        debugVM = false;
        log(useVM ? "Running in VM mode" : "Running in WGSL mode");
        if (useVM) {
            const bytecode = pcmCompiler.compile(editor.value);
            device.queue.writeBuffer(pcmBuffer, 0, bytecode.buffer);
            log(`Bytecode:\n${Array.from(bytecode).map(b => b.toString(16).padStart(4, '0')).join(' ')}`);
        }
        compileAndRun();
    };

    document.getElementById('debug_vm_button').onclick = () => {
        debugVM = !debugVM;
        useVM = debugVM; // Debug mode implies VM mode
        log(debugVM ? "Debugging VM memory" : "Exited debug mode");
        compileAndRun();
    };

    function setupDebugPipeline() {
        const debugShaderModule = device.createShaderModule({
            code: `
                struct Memory { pixels: array<vec4f, 65536>, } // 256x256 RGBA
                @group(0) @binding(0) var<storage, read> memory: Memory;

                @fragment
                fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                    let uv = pos.xy / vec2f(256.0, 256.0);
                    let grid = fract(uv * 16.0);
                    let color = memory.pixels[u32(pos.y) * 256 + u32(pos.x)];
                    if (grid.x < 0.05 || grid.y < 0.05) {
                        return color + vec4f(0.2, 0.2, 0.2, 1.0);
                    }
                    return color;
                }
            `,
        });

        pipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: device.createShaderModule({
                    code: `
                        @vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
                            let pos = array(
                                vec2f(-1, -1), vec2f(1, -1), vec2f(-1, 1),
                                vec2f(-1, 1), vec2f(1, -1), vec2f(1, 1)
                            );
                            return vec4f(pos[vi], 0.0, 1.0);
                        }`,
                }),
                entryPoint: 'vs',
            },
            fragment: {
                module: debugShaderModule,
                entryPoint: 'fs',
                targets: [{ format: canvasFormat }],
            },
        });

        bindGroup = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: memBuffer } },
            ],
        });
    }

    // --- Main Loop ---
    function renderLoop() {
        const t = (performance.now() - t0) / 1000.0;
        device.queue.writeBuffer(
            uniformBuffer, 0,
            new Float32Array([canvas.clientWidth, canvas.clientHeight, t, frame, textEditor.value.length])
        );

        const commandEncoder = device.createCommandEncoder();

        if (useVM) {
            const computePass = commandEncoder.beginComputePass();
            computePass.setPipeline(vmComputePipeline);
            computePass.setBindGroup(0, vmComputeBindGroup);
            computePass.dispatchWorkgroups(256 / 8, 256 / 8);
            computePass.end();

            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    loadOp: 'clear',
                    storeOp: 'store',
                    clearValue: { r: 0, g: 0, b: 0, a: 1 },
                }],
            });
            renderPass.setPipeline(vmRenderPipeline);
            renderPass.setBindGroup(0, vmRenderBindGroup);
            renderPass.draw(6);
            renderPass.end();
        } else {
            // Main render pass
            const passEncoder = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: tex_a.createView(),
                    loadOp: 'clear',
                    storeOp: 'store',
                    clearValue: { r: 0, g: 0, b: 0, a: 1 },
                }],
            });
            if(pipeline) {
                passEncoder.setPipeline(pipeline);
                passEncoder.setBindGroup(0, bindGroup);
                passEncoder.setBindGroup(1, textBindGroup);
                passEncoder.draw(6);
            }
            passEncoder.end();
        }

        // Copy to canvas
        commandEncoder.copyTextureToTexture({ texture: tex_a }, { texture: context.getCurrentTexture() }, [canvas.clientWidth, canvas.clientHeight]);

        // Ping-pong
        commandEncoder.copyTextureToTexture({ texture: tex_a }, { texture: tex_b }, [canvas.clientWidth, canvas.clientHeight]);

        device.queue.submit([commandEncoder.finish()]);

        frame++;
        requestAnimationFrame(renderLoop);
    }

    // --- UI & Examples ---
    document.getElementById('run_button').onclick = compileAndRun;
    document.getElementById('clear_button').onclick = () => {
        // This is a bit of a hack, we just draw a black screen to the feedback buffer
        const commandEncoder = device.createCommandEncoder();
        commandEncoder.beginRenderPass({
            colorAttachments: [{
                view: tex_b.createView(),
                loadOp: 'clear',
                storeOp: 'store',
                clearValue: { r: 0, g: 0, b: 0, a: 1 },
            }]
        }).end();
        device.queue.submit([commandEncoder.finish()]);
        log("State cleared.");
    };

    const examples = {
        wave: `r = 0.5 + 0.5 * cos(t + x * 0.01)\ng = 0.5 + 0.5 * cos(t + y * 0.01 + 2.0)\nb = 0.5 + 0.5 * cos(t + x * 0.01 + y * 0.01 + 4.0)\na = 1.0`,
        feedback: `let p = prev(uv);\nr = p.r * 0.95 + 0.05 * (0.5 + 0.5 * sin(t));\ng = p.g * 0.95 + 0.05 * (0.5 + 0.5 * cos(t));\nb = p.b * 0.95 + 0.05;\na = 1.0;`,
        plasma: `let v = 0.0;\nv = v + sin(x * 0.1 + t);\nv = v + sin(y * 0.1 + t);\nv = v + sin((x + y) * 0.1 + t);\nv = v + sin(sqrt(x*x + y*y) * 0.1 + t);\nlet cx = x + 0.5 * sin(t / 5.0);\nlet cy = y + 0.5 * cos(t / 3.0);\nv = v / 4.0;\nr = sin(v * 3.14);\ng = cos(v * 3.14);\nb = sin(v * 3.14 + 3.14 / 2.0);\na = 1.0;`,
        text_fx: `r = 0.1;\ng = 0.1;\nb = 0.1;\na = 1.0;\n\n// Animate text color and position\nlet wave = sin(x * 0.05 + t) * 10.0;\ntextColor(0.5 + 0.5 * sin(t), 0.5 + 0.5 * cos(t), 1.0, 1.0);\n// (Position animation requires modifying the text renderer itself)\n`
    };
    document.getElementById('example_select').onchange = (e) => {
        editor.value = examples[e.target.value];
        compileAndRun();
    };

    examples['conditional'] = `r = 0.0\ng=0.0\nb=1.0\nif (x - width/2.0)\nr = 1.0\ng=1.0\nb=0.0\n`;


    // --- SDF Generation ---
    function createSDFTexture() {
        const canvasSDF = document.createElement('canvas');
        canvasSDF.width = FONT_ATLAS_SIZE;
        canvasSDF.height = FONT_ATLAS_SIZE;
        const ctx = canvasSDF.getContext('2d');
        const charSize = FONT_ATLAS_SIZE / GLYPHS_PER_ROW;
        const fontSize = charSize * 0.8;

        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, FONT_ATLAS_SIZE, FONT_ATLAS_SIZE);
        ctx.fillStyle = 'white';
        ctx.font = `${fontSize}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const charMetrics = {};

        for (let i = 0; i < NUM_GLYPHS; i++) {
            const charCode = GLYPH_ASCII_START + i;
            const char = String.fromCharCode(charCode);
            const x = (i % GLYPHS_PER_ROW) * charSize + charSize / 2;
            const y = Math.floor(i / GLYPHS_PER_ROW) * charSize + charSize / 2;
            ctx.fillText(char, x, y);
            charMetrics[charCode] = { x: i % GLYPHS_PER_ROW, y: Math.floor(i/GLYPHS_PER_ROW), width: 1, height: 1 };
        }

        const imageData = ctx.getImageData(0, 0, FONT_ATLAS_SIZE, FONT_ATLAS_SIZE);
        const sdfData = new Uint8Array(FONT_ATLAS_SIZE * FONT_ATLAS_SIZE);

        // Naive SDF generation (slow, but works for a demo)
        for (let y = 0; y < FONT_ATLAS_SIZE; y++) {
            for (let x = 0; x < FONT_ATLAS_SIZE; x++) {
                const isInside = imageData.data[(y * FONT_ATLAS_SIZE + x) * 4] > 128;
                let minDistSq = Infinity;

                for (let j = 0; j < FONT_ATLAS_SIZE; j++) {
                    for (let i = 0; i < FONT_ATLAS_SIZE; i++) {
                        const isOpposite = imageData.data[(j * FONT_ATLAS_SIZE + i) * 4] > 128 !== isInside;
                        if (isOpposite) {
                            const distSq = (x-i)*(x-i) + (y-j)*(y-j);
                            if (distSq < minDistSq) {
                                minDistSq = distSq;
                            }
                        }
                    }
                }
                const dist = Math.sqrt(minDistSq);
                const signedDist = isInside ? dist : -dist;
                const normalizedDist = Math.max(0, Math.min(255, 128 + signedDist * 10)); // Scale factor 10
                sdfData[y * FONT_ATLAS_SIZE + x] = normalizedDist;
            }
        }

        const texture = device.createTexture({
            size: [FONT_ATLAS_SIZE, FONT_ATLAS_SIZE, 1],
            format: 'r8unorm',
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
        });
        device.queue.writeTexture(
            { texture },
            sdfData,
            { bytesPerRow: FONT_ATLAS_SIZE },
            { width: FONT_ATLAS_SIZE, height: FONT_ATLAS_SIZE }
        );
        return { sdfTexture: texture, charMetrics };
    }

    // --- Initial Run ---
    compileAndRun();
    updateGlyphBuffer();
    requestAnimationFrame(renderLoop);

  </script>
</body>
