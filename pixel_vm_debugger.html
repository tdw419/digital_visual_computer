<!DOCTYPE html>
<meta charset="utf-8" />
<title>Pixel Algebra (live → WGSL → GPU)</title>
<style>
  body {
    font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
    background: #111;
    color: #eee;
    display: flex;
    height: 100vh;
    margin: 0;
  }
  body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    margin: 0;
    gap: 1rem;
    padding: 1rem;
    box-sizing: border-box;
  }
  #editor_pane {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  #render_pane {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 1rem;
  }
  #editor, #text_editor {
    width: 100%;
    background: #222;
    border: 1px solid #444;
    color: #eee;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    flex-grow: 1;
    box-sizing: border-box;
  }
  #editor {
      height: 60%;
  }
  #text_editor {
      height: 20%;
  }
  canvas {
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 4px;
  }
  #debug_canvas {
      display: none; /* Hidden by default */
  }
  #tooltip {
    position: absolute;
    display: none;
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid #888;
    color: #eee;
    padding: 0.5rem;
    font-size: 12px;
    pointer-events: none;
    border-radius: 4px;
    white-space: pre;
  }
  button {
    background: #444;
    color: #eee;
    border: 1px solid #666;
    padding: 0.5rem 1rem;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  #buttons {
      display: flex;
      gap: 0.5rem;
  }
  #notes {
    margin-top: 1rem;
    background: #222;
    padding: 0.5rem;
    font-size: 12px;
    height: 100px;
    overflow-y: scroll;
    white-space: pre-wrap;
  }
</style>
<body>
  <div id="editor_pane">
    <textarea id="editor">
r = 0.5 + 0.5 * cos(t + x * 0.01)
g = 0.5 + 0.5 * cos(t + y * 0.01 + 2.0)
b = 0.5 + 0.5 * cos(t + x * 0.01 + y * 0.01 + 4.0)
a = 1.0

// Animate the text color
let text_r = 0.5 + 0.5 * sin(t * 2.0);
let text_g = 0.5 + 0.5 * sin(t * 3.0);
let text_b = 0.5 + 0.5 * sin(t * 5.0);
textColor(text_r, text_g, text_b, 1.0);
</textarea>
    <div id="buttons">
      <button id="run_button">Run</button>
      <button id="vm_mode_button">Run in VM</button>
      <button id="debug_vm_button">Debug VM</button>
      <button id="clear_button">Clear state</button>
      <select id="example_select">
        <option value="wave">Example: wave</option>
        <option value="feedback">Example: feedback</option>
        <option value="plasma">Example: plasma</option>
        <option value="text_fx">Example: text fx</option>
      </select>
    </div>
    <div id="notes">init…</div>
    <textarea id="text_editor">Type in the text area to see your keystrokes rendered by the GPU.</textarea>
  </div>
  <div id="render_pane">
    <canvas id="main_canvas"></canvas>
    <canvas id="debug_canvas"></canvas>
  </div>
  <div id="tooltip"></div>

  <script type="module">
    // --- Core Setup ---
    const mainCanvas = document.getElementById('main_canvas');
    const debugCanvas = document.getElementById('debug_canvas');
    const editor = document.getElementById('editor');
    const textEditor = document.getElementById('text_editor');
    const notes = document.getElementById('notes');
    let t0 = performance.now();
    let frame = 0;

    function log(msg) {
      notes.textContent = msg;
      console.log(msg);
    }

    if (!navigator.gpu) {
      throw new Error('WebGPU not supported on this browser.');
    }
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      throw new Error('No appropriate GPUAdapter found.');
    }
    const device = await adapter.requestDevice();

    // Main canvas for visual output
    const mainContext = mainCanvas.getContext('webgpu');
    const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
    mainContext.configure({
      device: device,
      format: canvasFormat,
    });

    // Debug canvas for memory visualization
    const debugContext = debugCanvas.getContext('webgpu');
    debugContext.configure({
        device: device,
        format: canvasFormat,
    });

    // --- Uniforms ---
    const uniformBuffer = device.createBuffer({
      size: 32, // 8 floats: width, height, time, frame, glyphCount, mouseX, mouseY, 0
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    // --- Ping-Pong Textures for Feedback ---
    let tex_a = createTexture();
    let tex_b = createTexture();
    function createTexture() {
        // Use mainCanvas for dimensions
        const dpr = window.devicePixelRatio || 1;
        const width = mainCanvas.clientWidth * dpr;
        const height = mainCanvas.clientHeight * dpr;
        mainCanvas.width = width;
        mainCanvas.height = height;

        return device.createTexture({
            size: [width, height],
            format: 'rgba8unorm',
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.STORAGE_BINDING,
        });
    }

    // --- Pixel VM Resources ---
    const VM_DIMENSIONS = 256; // 256x256 grid of VMs = 65,536 threads
    const OPCODE_MAP = {
      NOP: 0x0, LOADI: 0x1, STORE: 0x2, ADD: 0x3, SUB: 0x4, MUL: 0x5, DIV: 0x6,
      SIN: 0x7, COS: 0x8, MOV: 0x9, JMP: 0xA, JZ: 0xB, CALL: 0xC, RET: 0xD,
      SAMPLE: 0xE, HALT: 0xF,
    };
    const pcmBuffer = device.createBuffer({
        size: 1024 * 2, // 1KB of bytecode, shared by all VMs
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
    });
    // State buffer holds the state for all 65,536 VMs.
    // Each VM's state is a vec4<f32>: (r0, r1, r2, flags/ip/sp).
    const vmStateBuffer = device.createBuffer({
        size: VM_DIMENSIONS * VM_DIMENSIONS * 4 * 4, // 256x256 threads * vec4<f32>
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    const stackBuffer = device.createBuffer({
        size: VM_DIMENSIONS * VM_DIMENSIONS * 16 * 4, // 16 stack items per thread
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST
    });

    // --- Text Rendering ---
    const FONT_ATLAS_SIZE = 1024;
    const GLYPHS_PER_ROW = 16;
    const GLYPH_ASCII_START = 32;
    const NUM_GLYPHS = 95;
    const MAX_GLYPHS_ON_SCREEN = 1024;

    // 1. Procedural Font Atlas (SDF)
    const { sdfTexture, charMetrics } = createSDFTexture();

    // 2. Glyph Instance Buffer
    const glyphBuffer = device.createBuffer({
        size: MAX_GLYPHS_ON_SCREEN * 24, // 6 floats per glyph (codepoint, x, y, size, r, g, b, a)
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });

    // 3. Bind Group for Text
     const textBindGroupLayout = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: {} },
            { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
            { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } },
            { binding: 3, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
        ],
    });

    const textBindGroup = device.createBindGroup({
        layout: textBindGroupLayout,
        entries: [
            { binding: 0, resource: sdfTexture.createView() },
            { binding: 1, resource: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }) },
            { binding: 2, resource: { buffer: glyphBuffer } },
            { binding: 3, resource: { buffer: uniformBuffer } },
        ],
    });


    // --- Main Pixel Algebra Rendering ---
    let pipeline;
    let bindGroup;
    let userCode = editor.value;

    let vmComputePipeline;
    let vmRenderPipeline;
    let debugRenderPipeline;
    let vmComputeBindGroup;
    let vmRenderBindGroup;

    function setupVMPipelines() {
        const vmComputeModule = device.createShaderModule({
            code: `
                struct Uniforms {
                    width: f32, height: f32, time: f32, frame: f32,
                    glyphCount: f32, mouseX: f32, mouseY: f32, _pad: f32,
                };
                struct VMState {
                    // r0, r1, r2, flags
                    // flags is a u32, packing ip (16 bits) and sp (8 bits)
                    data: vec4f,
                };
                @group(0) @binding(0) var<storage, read> code: array<u16>;
                @group(0) @binding(1) var<storage, read_write> vm_state: array<VMState>;
                @group(0) @binding(2) var<storage, read_write> stack: array<u32>;
                @group(0) @binding(3) var prevFrame: texture_2d<f32>;
                @group(0) @binding(4) var smplr: sampler;
                @group(0) @binding(5) var<uniform> u: Uniforms;

                fn unpack_flags(flags: f32) -> vec2u {
                    let bits = u32(flags);
                    return vec2u(bits & 0xFFFFu, (bits >> 16u) & 0xFFu);
                }

                fn pack_flags(ip: u32, sp: u32) -> f32 {
                    return f32(ip | (sp << 16u));
                }

                @compute @workgroup_size(8, 8)
                fn vm_main(@builtin(global_invocation_id) id: vec3<u32>) {
                    let thread_idx = id.y * ${VM_DIMENSIONS}u + id.x;
                    var state = vm_state[thread_idx];

                    var regs: vec3f = state.data.xyz;
                    var ip_sp = unpack_flags(state.data.w);
                    var ip = ip_sp.x;
                    var sp = ip_sp.y;

                    var running = true;
                    for (var i = 0; i < 16; i = i + 1) { // Max 16 instructions per frame
                        if (!running || ip >= arrayLength(&code)) { break; }

                        let instr = code[ip];
                        let opcode = (instr >> 12) & 0xF;
                        let r_dst = (instr >> 8) & 0xF;
                        let val = instr & 0xFF;

                        switch (opcode) {
                            case ${OPCODE_MAP.NOP}: { ip = ip + 1u; }
                            case ${OPCODE_MAP.LOADI}: {
                                regs[r_dst] = f32(val);
                                ip = ip + 1u;
                            }
                            case ${OPCODE_MAP.ADD}: {
                                let r_src1 = (val >> 4) & 0xF;
                                let r_src2 = val & 0xF;
                                regs[r_dst] = regs[r_src1] + regs[r_src2];
                                ip = ip + 1u;
                            }
                            case ${OPCODE_MAP.MUL}: {
                                let r_src1 = (val >> 4) & 0xF;
                                let r_src2 = val & 0xF;
                                regs[r_dst] = regs[r_src1] * regs[r_src2];
                                ip = ip + 1u;
                            }
                            case ${OPCODE_MAP.STORE}: {
                                // For now, storing to output pixel. A real system would write to a memory texture.
                                let r_src = (val >> 4) & 0xF;
                                let channel = val & 0xF;
                                if (channel < 3u) {
                                    state.data[channel] = regs[r_src];
                                }
                                ip = ip + 1u;
                            }
                            case ${OPCODE_MAP.JZ}: {
                                if (regs[r_dst] == 0.0) {
                                    ip = u32(val);
                                } else {
                                    ip = ip + 1u;
                                }
                            }
                            case ${OPCODE_MAP.CALL}: {
                                let stack_addr = (thread_idx * 16u) + sp;
                                stack[stack_addr] = ip + 1u;
                                sp = sp + 1u;
                                ip = u32(val);
                            }
                            case ${OPCODE_MAP.RET}: {
                                sp = sp - 1u;
                                let stack_addr = (thread_idx * 16u) + sp;
                                ip = stack[stack_addr];
                            }
                            case ${OPCODE_MAP.HALT}: { running = false; }
                            default: { ip = ip + 1u; }
                        }
                    }

                    state.data.xyz = regs;
                    state.data.w = pack_flags(ip, sp);
                    vm_state[thread_idx] = state;
                }
            `,
        });

        vmComputePipeline = device.createComputePipeline({
            layout: 'auto',
            compute: { module: vmComputeModule, entryPoint: 'vm_main' },
        });

        const sharedVertexModule = device.createShaderModule({
            code: `
                @vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
                    let pos = array(vec2f(-1, -1), vec2f(1, -1), vec2f(-1, 1), vec2f(-1, 1), vec2f(1, -1), vec2f(1, 1));
                    return vec4f(pos[vi], 0.0, 1.0);
                }`,
        });

        const vmRenderModule = device.createShaderModule({
            code: `
                 struct VMState { data: vec4f };
                @group(0) @binding(0) var<storage, read> vm_state: array<VMState>;
                @fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                    let thread_idx = u32(pos.y) * ${VM_DIMENSIONS}u + u32(pos.x);
                    let state = vm_state[thread_idx];
                    // Output is just the first 3 registers (r,g,b)
                    return vec4f(state.data.xyz, 1.0);
                }
            `
        });
         vmRenderPipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: { module: sharedVertexModule, entryPoint: 'vs' },
            fragment: { module: vmRenderModule, entryPoint: 'fs', targets: [{ format: canvasFormat }] },
        });

        const debugRenderModule = device.createShaderModule({
            code: `
                struct VMState { data: vec4f };
                @group(0) @binding(0) var<storage, read> vm_state: array<VMState>;
                fn unpack_flags(flags: f32) -> vec2u {
                    let bits = u32(flags);
                    return vec2u(bits & 0xFFFFu, (bits >> 16u) & 0xFFu);
                }
                @fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                    let thread_idx = u32(pos.y) * ${VM_DIMENSIONS}u + u32(pos.x);
                    let state = vm_state[thread_idx];
                    let regs = state.data.xyz;
                    let ip = unpack_flags(state.data.w).x;
                    var color = vec4f(regs.x / 255.0, regs.y / 255.0, f32(ip) / 20.0, 1.0);
                    if (fract(pos.x / 16.0) < 0.05 || fract(pos.y / 16.0) < 0.05) {
                        color = color * 0.8 + vec4f(0.2, 0.2, 0.2, 0.0);
                    }
                    return color;
                }
            `
        });
        debugRenderPipeline = device.createRenderPipeline({
            layout: vmRenderPipeline.getBindGroupLayout(0),
            vertex: { module: sharedVertexModule, entryPoint: 'vs' },
            fragment: { module: debugRenderModule, entryPoint: 'fs', targets: [{ format: canvasFormat }] },
        });

        vmComputeBindGroup = device.createBindGroup({
            layout: vmComputePipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: pcmBuffer } },
                { binding: 1, resource: { buffer: memBuffer } },
                { binding: 2, resource: { buffer: regBuffer } },
                { binding: 3, resource: { buffer: stackBuffer } },
                { binding: 4, resource: tex_b.createView() },
                { binding: 5, resource: device.createSampler() },
            ],
        });

        vmComputeBindGroup = device.createBindGroup({
            layout: vmComputePipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: pcmBuffer } },
                { binding: 1, resource: { buffer: vmStateBuffer } },
                { binding: 2, resource: { buffer: stackBuffer } },
                { binding: 3, resource: tex_b.createView() },
                { binding: 4, resource: device.createSampler() },
                { binding: 5, resource: { buffer: uniformBuffer } },
            ],
        });

        vmRenderBindGroup = device.createBindGroup({
            layout: vmRenderPipeline.getBindGroupLayout(0),
            entries: [
                { binding: 0, resource: { buffer: vmStateBuffer } },
            ],
        });
    }

    function setupMainPipeline(fragmentShader) {
      const bindGroupLayout = device.createBindGroupLayout({
        entries: [
          { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
          { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: {} },
          { binding: 2, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
        ],
      });

      pipeline = device.createRenderPipeline({
        layout: device.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout, textBindGroupLayout] }),
        vertex: {
          module: device.createShaderModule({
            code: `
                        @vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
                            let pos = array(
                                vec2f(-1, -1), vec2f(1, -1), vec2f(-1, 1),
                                vec2f(-1, 1), vec2f(1, -1), vec2f(1, 1)
                            );
                            return vec4f(pos[vi], 0.0, 1.0);
                        }`,
          }),
          entryPoint: 'vs',
        },
        fragment: {
          module: device.createShaderModule({ code: fragmentShader }),
          entryPoint: 'fs',
          targets: [{ format: canvasFormat }],
        },
        primitive: { topology: 'triangle-list' },
      });

      bindGroup = device.createBindGroup({
        layout: bindGroupLayout,
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: tex_b.createView() },
          { binding: 2, resource: device.createSampler() },
        ],
      });
    }

    function compileAndRun() {
        userCode = editor.value;
        const uniformDeclarations = `
            struct Uniforms {
                width: f32,
                height: f32,
                time: f32,
                frame: f32,
                glyphCount: f32,
            };
            @group(0) @binding(0) var<uniform> u: Uniforms;
            @group(0) @binding(1) var prevFrame: texture_2d<f32>;
            @group(0) @binding(2) var smplr: sampler;
        `;
        const textDeclarations = `
            struct Glyph {
                codepoint: u32,
                x: f32,
                y: f32,
                size: f32,
                r: f32,
                g: f32,
                b: f32,
                a: f32,
            };
            struct Glyphs {
                glyphs: array<Glyph>,
            };
            @group(1) @binding(0) var sdf_atlas: texture_2d<f32>;
            @group(1) @binding(1) var sdf_sampler: sampler;
            @group(1) @binding(2) var<storage, read> glyph_data: Glyphs;
        `;

        const helperFunctions = `
            fn hsv(h: f32, s: f32, v: f32) -> vec3f {
                let c = v * s;
                let h_ = h * 6.0;
                let x = c * (1.0 - abs(h_ % 2.0 - 1.0));
                var r, g, b: f32;
                if (h_ < 1.0) { r = c; g = x; b = 0.0; }
                else if (h_ < 2.0) { r = x; g = c; b = 0.0; }
                else if (h_ < 3.0) { r = 0.0; g = c; b = x; }
                else if (h_ < 4.0) { r = 0.0; g = x; b = c; }
                else if (h_ < 5.0) { r = x; g = 0.0; b = c; }
                else { r = c; g = 0.0; b = x; }
                let m = v - c;
                return vec3f(r + m, g + m, b + m);
            }
            fn prev(uv: vec2f) -> vec4f {
                return textureSample(prevFrame, smplr, uv);
            }
        `;

        const textRenderFunction = `
            var<private> text_color_val: vec4f = vec4f(1.0, 1.0, 1.0, 1.0);
            fn textColor(r: f32, g: f32, b: f32, a: f32) {
                text_color_val = vec4f(r, g, b, a);
            }

            fn renderText(fragCoord: vec2f, baseColor: vec4f) -> vec4f {
                var color = baseColor;
                for (var i = 0u; i < u32(u.glyphCount); i = i + 1u) {
                     let g = glyph_data.glyphs[i];
                     if (g.codepoint == 0u) { break; }

                     let atlas_uv = get_atlas_uv(g.codepoint, (fragCoord - vec2f(g.x, g.y)) / g.size);
                     if (atlas_uv.x < 0.0) { continue; }

                     let dist = textureSample(sdf_atlas, sdf_sampler, atlas_uv).r;
                     let w = fwidth(dist);
                     let alpha = smoothstep(0.5 - w, 0.5 + w, dist);

                     let glyph_color = text_color_val;
                     color = mix(color, glyph_color, alpha);
                }
                return color;
            }

            fn get_atlas_uv(codepoint: u32, local_uv: vec2f) -> vec2f {
                if (codepoint < 32u || codepoint > 126u) { return vec2f(-1.0); }
                if (local_uv.x < 0.0 || local_uv.x > 1.0 || local_uv.y < 0.0 || local_uv.y > 1.0) { return vec2f(-1.0); }

                let glyph_index = codepoint - 32u;
                let glyph_x = f32(glyph_index % 16u);
                let glyph_y = f32(floor(f32(glyph_index) / 16.0));

                let uv_in_cell = local_uv / 16.0;
                let atlas_uv = vec2f(glyph_x / 16.0, glyph_y / 16.0) + uv_in_cell;

                return atlas_uv;
            }
        `;

        // Transpile user code from simple assignments to WGSL
        let transpiledCode = userCode
            .replace(/let\s+/g, 'var ')
            .replace(/const\s+/g, 'let ')
            .replace(/(\d+\.\d+)/g, "$1f")
            .replace(/(\d+)([^f\w.])/g, "$1.0$2")
            .replace(/vec[234]/g, "$&f");

        if (debugVM) {
            setupDebugPipeline();
            log('VM debug pipeline setup successful.');
        } else if (useVM) {
            setupVMPipelines();
            log('VM pipelines setup successful.');
        } else {
            const shader = `
                ${uniformDeclarations}
                ${textDeclarations}
                ${helperFunctions}
                ${textRenderFunction}

                @fragment
                fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
                    let x = pos.x;
                    let y = pos.y;
                    let width = u.width;
                    let height = u.height;
                    let uv = pos.xy / vec2f(width, height);
                    let t = u.time;
                    let mouse = vec2f(0.0, 0.0); // Placeholder
                    var r, g, b, a: f32;

                    ${transpiledCode}

                    var final_color = vec4f(r, g, b, a);
                    final_color = renderText(pos.xy, final_color);
                    return final_color;
                }
            `;
            try {
                setupMainPipeline(shader);
                log('Compilation successful.');
            } catch(e) {
                log(`Shader compilation error:\n${e.message}`);
            }
        }
    }

    // --- Keystroke Handling & Text Buffer Update ---
    function updateGlyphBuffer() {
        const text = textEditor.value;
        const data = new Float32Array(MAX_GLYPHS_ON_SCREEN * 8);
        let cursorX = 10.0, cursorY = 20.0;
        const fontSize = 16.0, lineHeight = 20.0, advance = 9.0;
        for(let i = 0; i < text.length && i < MAX_GLYPHS_ON_SCREEN; i++) {
            const char = text[i];
            if (char === '\n') {
                cursorX = 10.0;
                cursorY += lineHeight;
                continue;
            }
            const offset = i * 8;
            data.set([char.charCodeAt(0), cursorX, cursorY, fontSize, 1,1,1,1], offset);
            cursorX += advance;
        }
        device.queue.writeBuffer(glyphBuffer, 0, data);
    }
    textEditor.addEventListener('input', updateGlyphBuffer);

    // --- Pixel VM Assembler ---
    class Assembler {
        assemble(source) {
            const bytecode = [];
            const labels = new Map();
            const lines = source.split('\n').map(l => l.trim().split('//')[0]).filter(Boolean);

            // First pass: collect labels
            let address = 0;
            for (const line of lines) {
                if (line.endsWith(':')) {
                    labels.set(line.slice(0, -1), address);
                } else {
                    address++;
                }
            }

            // Second pass: assemble instructions
            for (const line of lines) {
                if (line.endsWith(':')) continue;
                const [op, ...args] = line.replace(/,/g, '').split(/\s+/);
                const opcode = OPCODE_MAP[op.toUpperCase()];
                if (opcode === undefined) throw new Error(`Unknown opcode: ${op}`);

                let r_dst = 0, val = 0;
                if (args[0]) r_dst = parseInt(args[0].slice(1));

                if (['LOADI', 'JZ', 'CALL'].includes(op.toUpperCase())) {
                    const target = args[0];
                     if (op.toUpperCase() === 'JZ') {
                        target = args[1];
                    }
                    val = labels.has(target) ? labels.get(target) : parseInt(target);
                } else if (args.length > 1) {
                    const r_src1 = parseInt(args[1].slice(1));
                    const r_src2 = parseInt(args[2].slice(1));
                    val = (r_src1 << 4) | r_src2;
                }

                bytecode.push((opcode << 12) | (r_dst << 8) | val);
            }
            return new Uint16Array(bytecode);
        }
    }
    const assembler = new Assembler();

    let useVM = false;
    let debugVM = false;

    const vmExample = `
// Demo of CALL and RET opcodes
// Main loop increments r0 and stores it to red channel
// Then calls a subroutine 'blue_fade'
LOADI R1, 1

loop:
ADD R0, R0, R1
STORE R0, 0 // r0 -> red channel
CALL blue_fade
JMP loop

// Subroutine: fades the blue channel
blue_fade:
LOADI R2, 1
SUB R2, R2, R1 // r2 = r2 - r1
STORE R2, 2 // r2 -> blue channel
RET
`;

    document.getElementById('vm_mode_button').onclick = () => {
        useVM = !useVM;
        debugVM = false;
        debugCanvas.style.display = 'none';
        log(useVM ? "Running in VM mode" : "Running in WGSL mode");
        if (useVM) {
            editor.value = vmExample;
            try {
                const bytecode = assembler.assemble(editor.value);
                device.queue.writeBuffer(pcmBuffer, 0, bytecode.buffer);
                log(`Assembled ${bytecode.length} instructions.`);
                setupVMPipelines();
            } catch (e) {
                log(`Assembly Error: ${e.message}`);
            }
        } else {
            compileAndRun();
        }
    };

    document.getElementById('debug_vm_button').onclick = () => {
        debugVM = !debugVM;
        useVM = debugVM;
        debugCanvas.style.display = debugVM ? 'block' : 'none';
        log(debugVM ? "Debugging VM memory" : "Exited debug mode");
        if (debugVM) {
            editor.value = vmExample;
            try {
                const bytecode = assembler.assemble(editor.value);
                device.queue.writeBuffer(pcmBuffer, 0, bytecode.buffer);
                log(`Assembled ${bytecode.length} instructions.`);
                setupVMPipelines();
            } catch(e) {
                log(`Assembly Error: ${e.message}`);
            }
        }
    };

    // --- Main Loop ---
    function renderLoop() {
        const t = (performance.now() - t0) / 1000.0;
        device.queue.writeBuffer(
            uniformBuffer, 0,
            new Float32Array([mainCanvas.width, mainCanvas.height, t, frame, textEditor.value.length, 0, 0, 0])
        );

        const commandEncoder = device.createCommandEncoder();

        if (useVM) {
            const computePass = commandEncoder.beginComputePass();
            computePass.setPipeline(vmComputePipeline);
            computePass.setBindGroup(0, vmComputeBindGroup);
            computePass.dispatchWorkgroups(VM_DIMENSIONS / 8, VM_DIMENSIONS / 8);
            computePass.end();

            // Render VM output to main canvas
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: mainContext.getCurrentTexture().createView(),
                    loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 },
                }],
            });
            renderPass.setPipeline(vmRenderPipeline);
            renderPass.setBindGroup(0, vmRenderBindGroup);
            renderPass.draw(6);
            renderPass.end();

            if (debugVM) {
                // Render debug view to debug canvas
                 const debugPass = commandEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: debugContext.getCurrentTexture().createView(),
                        loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 },
                    }],
                });
                debugPass.setPipeline(vmRenderPipeline); // Reuse same pipeline for now
                debugPass.setBindGroup(0, vmRenderBindGroup);
                debugPass.draw(6);
                debugPass.end();
            }

        } else {
             const passEncoder = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: tex_a.createView(),
                    loadOp: 'clear', storeOp: 'store',
                    clearValue: { r: 0, g: 0, b: 0, a: 1 },
                }],
            });
            if(pipeline) {
                passEncoder.setPipeline(pipeline);
                passEncoder.setBindGroup(0, bindGroup);
                passEncoder.setBindGroup(1, textBindGroup);
                passEncoder.draw(6);
            }
            passEncoder.end();
             commandEncoder.copyTextureToTexture({ texture: tex_a }, { texture: mainContext.getCurrentTexture() }, [mainCanvas.width, mainCanvas.height]);
        }

        // Ping-pong for feedback effects in non-VM mode
        if (!useVM) {
            commandEncoder.copyTextureToTexture({ texture: tex_a }, { texture: tex_b }, [mainCanvas.width, mainCanvas.height]);
        }

        // Handle debug inspection readback
        if (debugVM && mousePos) {
            commandEncoder.copyBufferToBuffer(
                vmStateBuffer,
                (mousePos.y * VM_DIMENSIONS + mousePos.x) * 16, // source offset 16 bytes per vec4
                readbackBuffer,
                0,
                16
            );
        }

        device.queue.submit([commandEncoder.finish()]);

        if (debugVM && mousePos) {
            readbackBuffer.mapAsync(GPUMapMode.READ).then(() => {
                const data = new Float32Array(readbackBuffer.getMappedRange());
                const ip = data[3];
                tooltip.style.display = 'block';
                tooltip.style.left = `${mousePos.clientX + 15}px`;
                tooltip.style.top = `${mousePos.clientY}px`;
                tooltip.textContent = `Thread: [${mousePos.x}, ${mousePos.y}]\nIP: ${ip.toFixed(0)}\nR0: ${data[0].toFixed(2)}\nR1: ${data[1].toFixed(2)}\nR2: ${data[2].toFixed(2)}`;
                readbackBuffer.unmap();
            });
            mousePos = null; // Reset mouse position
        }

        frame++;
        requestAnimationFrame(renderLoop);
    }

    // --- UI & Examples ---
    document.getElementById('run_button').onclick = compileAndRun;
    document.getElementById('clear_button').onclick = () => {
        // This is a bit of a hack, we just draw a black screen to the feedback buffer
        const commandEncoder = device.createCommandEncoder();
        commandEncoder.beginRenderPass({
            colorAttachments: [{
                view: tex_b.createView(),
                loadOp: 'clear',
                storeOp: 'store',
                clearValue: { r: 0, g: 0, b: 0, a: 1 },
            }]
        }).end();
        device.queue.submit([commandEncoder.finish()]);
        log("State cleared.");
    };

    const examples = {
        wave: `r = 0.5 + 0.5 * cos(t + x * 0.01)\ng = 0.5 + 0.5 * cos(t + y * 0.01 + 2.0)\nb = 0.5 + 0.5 * cos(t + x * 0.01 + y * 0.01 + 4.0)\na = 1.0`,
        feedback: `let p = prev(uv);\nr = p.r * 0.95 + 0.05 * (0.5 + 0.5 * sin(t));\ng = p.g * 0.95 + 0.05 * (0.5 + 0.5 * cos(t));\nb = p.b * 0.95 + 0.05;\na = 1.0;`,
        plasma: `let v = 0.0;\nv = v + sin(x * 0.1 + t);\nv = v + sin(y * 0.1 + t);\nv = v + sin((x + y) * 0.1 + t);\nv = v + sin(sqrt(x*x + y*y) * 0.1 + t);\nlet cx = x + 0.5 * sin(t / 5.0);\nlet cy = y + 0.5 * cos(t / 3.0);\nv = v / 4.0;\nr = sin(v * 3.14);\ng = cos(v * 3.14);\nb = sin(v * 3.14 + 3.14 / 2.0);\na = 1.0;`,
        text_fx: `r = 0.1;\ng = 0.1;\nb = 0.1;\na = 1.0;\n\n// Animate text color and position\nlet wave = sin(x * 0.05 + t) * 10.0;\ntextColor(0.5 + 0.5 * sin(t), 0.5 + 0.5 * cos(t), 1.0, 1.0);\n// (Position animation requires modifying the text renderer itself)\n`
    };
    document.getElementById('example_select').onchange = (e) => {
        editor.value = examples[e.target.value];
        compileAndRun();
    };

    examples['conditional'] = `r = 0.0\ng=0.0\nb=1.0\nif (x - width/2.0)\nr = 1.0\ng=1.0\nb=0.0\n`;


    // --- SDF Generation ---
    function createSDFTexture() {
        const canvasSDF = document.createElement('canvas');
        canvasSDF.width = FONT_ATLAS_SIZE;
        canvasSDF.height = FONT_ATLAS_SIZE;
        const ctx = canvasSDF.getContext('2d');
        const charSize = FONT_ATLAS_SIZE / GLYPHS_PER_ROW;
        const fontSize = charSize * 0.8;

        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, FONT_ATLAS_SIZE, FONT_ATLAS_SIZE);
        ctx.fillStyle = 'white';
        ctx.font = `${fontSize}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const charMetrics = {};

        for (let i = 0; i < NUM_GLYPHS; i++) {
            const charCode = GLYPH_ASCII_START + i;
            const char = String.fromCharCode(charCode);
            const x = (i % GLYPHS_PER_ROW) * charSize + charSize / 2;
            const y = Math.floor(i / GLYPHS_PER_ROW) * charSize + charSize / 2;
            ctx.fillText(char, x, y);
            charMetrics[charCode] = { x: i % GLYPHS_PER_ROW, y: Math.floor(i/GLYPHS_PER_ROW), width: 1, height: 1 };
        }

        const imageData = ctx.getImageData(0, 0, FONT_ATLAS_SIZE, FONT_ATLAS_SIZE);
        const sdfData = new Uint8Array(FONT_ATLAS_SIZE * FONT_ATLAS_SIZE);

        // Naive SDF generation (slow, but works for a demo)
        for (let y = 0; y < FONT_ATLAS_SIZE; y++) {
            for (let x = 0; x < FONT_ATLAS_SIZE; x++) {
                const isInside = imageData.data[(y * FONT_ATLAS_SIZE + x) * 4] > 128;
                let minDistSq = Infinity;

                for (let j = 0; j < FONT_ATLAS_SIZE; j++) {
                    for (let i = 0; i < FONT_ATLAS_SIZE; i++) {
                        const isOpposite = imageData.data[(j * FONT_ATLAS_SIZE + i) * 4] > 128 !== isInside;
                        if (isOpposite) {
                            const distSq = (x-i)*(x-i) + (y-j)*(y-j);
                            if (distSq < minDistSq) {
                                minDistSq = distSq;
                            }
                        }
                    }
                }
                const dist = Math.sqrt(minDistSq);
                const signedDist = isInside ? dist : -dist;
                const normalizedDist = Math.max(0, Math.min(255, 128 + signedDist * 10)); // Scale factor 10
                sdfData[y * FONT_ATLAS_SIZE + x] = normalizedDist;
            }
        }

        const texture = device.createTexture({
            size: [FONT_ATLAS_SIZE, FONT_ATLAS_SIZE, 1],
            format: 'r8unorm',
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
        });
        device.queue.writeTexture(
            { texture },
            sdfData,
            { bytesPerRow: FONT_ATLAS_SIZE },
            { width: FONT_ATLAS_SIZE, height: FONT_ATLAS_SIZE }
        );
        return { sdfTexture: texture, charMetrics };
    }

    // --- Initial Run ---
    compileAndRun();
    updateGlyphBuffer();

    const tooltip = document.getElementById('tooltip');
    let mousePos = null;

    const readbackBuffer = device.createBuffer({
        size: 16, // Size of one VM state vec4<f32>
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });

    debugCanvas.addEventListener('mousemove', e => {
        const rect = debugCanvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / rect.width * VM_DIMENSIONS);
        const y = Math.floor((e.clientY - rect.top) / rect.height * VM_DIMENSIONS);
        if (x >= 0 && x < VM_DIMENSIONS && y >= 0 && y < VM_DIMENSIONS) {
            mousePos = { x, y, clientX: e.clientX, clientY: e.clientY };
        }
    });

    debugCanvas.addEventListener('mouseleave', () => {
        mousePos = null;
        tooltip.style.display = 'none';
    });

    requestAnimationFrame(renderLoop);

  </script>
</body>
